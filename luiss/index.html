<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Filiera AgriTech LUISS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&family=Montserrat:wght@500;600&display=swap">
<style>
/* Layout: barra di navigazione fissa + tre viste a hash (#insieme, #p1–#p9, #anagrafica), griglie che si riducono a una colonna su telefono */
:root{
  --bg:#F5F7F9; --surface:#FFFFFF; --ink:#0F1A2A; --muted:#4A5568; --line:#DCE2E8; --soft:#EEF1F4;
  --accent:#00706E; --accent-soft:#DDF5F4; --on-accent:#FFFFFF;
  --warm:#8A5A00; --warm-soft:#FFF3D1;
  --blue:#002A5C; --blue-soft:#E3EAF3;
  --navy:#002A5C; --on-navy:#FFFFFF; --navy-muted:#BFD0E3;
  --tbc:#7A5600; --tbc-soft:#FFF1C7;
  --pmi:#0BB9B7; --gi:#AFC2D8; --tp:#002A5C; --odr:#5B7FA8;
  --f-display:'Inter Tight', 'Archivo', system-ui, sans-serif;
  --f-body:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1520; --surface:#16202D; --ink:#EEF2F6; --muted:#A9B4C2; --line:#2A3646; --soft:#1F2A38;
  --accent:#3FD6D3; --accent-soft:#0F3433; --on-accent:#0D1520;
  --warm:#FFCB45; --warm-soft:#33280C;
  --blue:#9EC1EA; --blue-soft:#1C2B40;
  --navy:#001A3A; --on-navy:#FFFFFF; --navy-muted:#A9B4C2;
  --tbc:#FFCB45; --tbc-soft:#33280C;
  --pmi:#0BB9B7; --gi:#7F93AB; --tp:#6E9BD6; --odr:#8FA9C9;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1520; --surface:#16202D; --ink:#EEF2F6; --muted:#A9B4C2; --line:#2A3646; --soft:#1F2A38;
  --accent:#3FD6D3; --accent-soft:#0F3433; --on-accent:#0D1520;
  --warm:#FFCB45; --warm-soft:#33280C;
  --blue:#9EC1EA; --blue-soft:#1C2B40;
  --navy:#001A3A; --on-navy:#FFFFFF; --navy-muted:#A9B4C2;
  --tbc:#FFCB45; --tbc-soft:#33280C;
  --pmi:#0BB9B7; --gi:#7F93AB; --tp:#6E9BD6; --odr:#8FA9C9;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--navy)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0; letter-spacing:-0.01em}
.wrap{max-width:1180px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* barra */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--navy); color:var(--on-navy)}
.bar .wrap{display:flex; align-items:center; gap:16px; padding-block:10px; flex-wrap:wrap}
.brand{font-family:var(--f-display); font-weight:800; font-size:15px; letter-spacing:0.01em; color:var(--on-navy); text-decoration:none; margin-right:auto}
.brand span{color:var(--navy-muted); font-weight:600}
.nav{display:flex; gap:4px; flex-wrap:wrap}
.nav a{color:var(--navy-muted); text-decoration:none; font-weight:600; font-size:14px; padding:8px 12px; border-radius:6px; min-height:40px; display:inline-flex; align-items:center}
.nav a:hover{color:var(--on-navy); background:rgba(255,255,255,0.08)}
.nav a[aria-current="page"]{color:var(--on-navy); background:rgba(255,255,255,0.14)}
.pnav{display:flex; gap:4px; flex-wrap:wrap}
.pnav a{font-size:13px; padding:6px 9px; min-height:34px}

main{padding-block:28px 56px}
.eyebrow{font-size:12px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent)}
.lead{font-size:17px; color:var(--muted); max-width:62ch; margin:0}
section+section{margin-top:36px}
.sec-h{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.sec-h h2{font-size:22px}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:5px 11px; border-radius:999px; background:var(--soft); color:var(--ink); white-space:nowrap}
.chip.dark{background:var(--navy); color:var(--on-navy)}
.chip.teal{background:var(--accent-soft); color:var(--accent)}
.chip.warm{background:var(--warm-soft); color:var(--warm)}
.chip.blue{background:var(--blue-soft); color:var(--blue)}
.chip.tbc{background:var(--tbc-soft); color:var(--tbc)}

/* hero insieme */
.hero{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:28px; align-items:end}
.hero h1{font-size:clamp(34px, 5vw, 56px); line-height:1.02; font-weight:800; margin:8px 0 12px}
.kpis{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px}
.kpi.ink{background:var(--navy); border-color:var(--navy); color:var(--on-navy)}
.kpi.ink .k-l{color:var(--navy-muted)}
.kpi.teal{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.kpi.teal .k-l{color:var(--on-accent); opacity:0.85}
.k-l{font-size:12.5px; color:var(--muted)}
.k-v{font-family:var(--f-display); font-weight:800; font-size:30px; line-height:1.1; font-variant-numeric:tabular-nums}
.k-s{font-size:12.5px}

.split{height:26px; display:flex; border-radius:5px; overflow:hidden; font-size:12px; font-weight:600}
.split div{display:flex; align-items:center; padding-inline:8px; white-space:nowrap; overflow:hidden}
.s-pmi{background:var(--pmi); color:#002A5C}
.s-gi{background:var(--gi); color:#002A5C}
.s-tp{background:var(--tp); color:#FFFFFF; justify-content:center}
.s-odr{background:var(--odr); color:#FFFFFF; justify-content:center}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-top:8px}
.legend i{display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:5px; vertical-align:-1px}

.grid4{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px}
.grid3{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px}
.box{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px}
.box h3{font-size:13px; text-transform:uppercase; letter-spacing:0.06em; font-family:var(--f-body); font-weight:600; margin-bottom:6px}
.box p{margin:0; font-size:14px}
.box.inv{background:var(--navy); color:var(--on-navy); border-color:var(--navy)}
.box.inv h3{color:var(--accent)}

/* card progetto */
.pcard{display:flex; flex-direction:column; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; text-decoration:none; color:var(--ink); transition:border-color .15s, transform .15s; min-width:0}
.pcard:hover{border-color:var(--accent); transform:translateY(-2px)}
.pcard .top{display:flex; justify-content:space-between; align-items:center; gap:8px}
.pcard .pn{font-family:var(--f-display); font-weight:800; font-size:15px; color:var(--accent)}
.pcard h3{font-size:20px; line-height:1.15}
.pcard .d{font-size:13.5px; color:var(--muted); flex:1 1 auto}
.pcard .money{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.pcard .money b{font-family:var(--f-display); font-size:22px; font-variant-numeric:tabular-nums}
.pcard .money span{font-size:13px; color:var(--muted)}
.mini{height:7px; display:flex; border-radius:3px; overflow:hidden; background:var(--soft)}
.mini i{display:block; height:100%}
.who{font-size:12.5px; color:var(--muted); line-height:1.4}
.who b{color:var(--ink); font-weight:600}
.open{font-size:13px; font-weight:600; color:var(--accent)}

.checks{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px 24px; font-size:14px; margin:0; padding:0; list-style:none}
.checks li{display:flex; gap:8px}
.checks li::before{content:"✓"; color:var(--accent); font-weight:700}
.issues{margin:0; padding-left:20px; font-size:14px; display:grid; gap:6px}

/* pagina progetto */
.back{display:inline-flex; align-items:center; gap:6px; font-weight:600; text-decoration:none; font-size:14px; min-height:40px}
.phead{background:var(--navy); color:var(--on-navy); border-radius:12px; padding:24px; display:flex; gap:22px; align-items:center; margin-top:8px}
.phead .big{font-family:var(--f-display); font-weight:800; font-size:64px; line-height:1; color:var(--accent)}
.phead h1{font-size:clamp(26px, 4vw, 40px); line-height:1.05}
.phead p{margin:6px 0 0; color:var(--navy-muted); font-size:16px; max-width:60ch}
.two{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:18px; align-items:start}
.prose p{margin:0 0 10px; max-width:66ch}
.amb dl{margin:0; display:grid; gap:12px}
.amb dt{font-size:12.5px; color:var(--muted)}
.amb dd{margin:2px 0 0; font-weight:600}
.lvl{font-size:12.5px; font-weight:600; color:var(--accent)}
.tablebox{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px}
table{width:100%; border-collapse:collapse; font-size:14px; min-width:640px}
th,td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top}
th{background:var(--soft); font-size:12.5px; font-weight:600; color:var(--muted)}
td.r,th.r{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
tr.tot td{font-weight:700; border-bottom:none}
.ename{font-weight:600}
.ename a{color:var(--ink); text-decoration:none; border-bottom:1px dotted var(--muted)}
.ename a:hover{color:var(--accent)}
.etype{display:block; font-size:12px; color:var(--muted); font-weight:400}
.pager{display:flex; justify-content:space-between; gap:12px; margin-top:28px; flex-wrap:wrap}
.pager a{display:inline-flex; flex-direction:column; text-decoration:none; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); min-width:0; max-width:48%}
.pager a small{color:var(--muted)}
.pager a b{font-family:var(--f-display)}

/* anagrafica */
.tools{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.filter{display:flex; gap:6px; flex-wrap:wrap}
.filter button{font:inherit; font-size:13.5px; font-weight:600; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:7px 14px; min-height:40px; cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--navy); color:var(--on-navy); border-color:var(--navy)}
.search{display:flex; flex-direction:column; gap:2px}
.search label{font-size:12px; color:var(--muted)}
.search input{font:inherit; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); min-height:40px; width:min(280px, 100%)}
.ecards{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px; margin-top:16px}
.ecard{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:10px; min-width:0}
.ecard h3{font-size:18px}
.ecard .row{display:flex; justify-content:space-between; gap:8px; align-items:flex-start}
.ecard .prof{font-size:13.5px; color:var(--muted); margin:0}
.ecard dl{margin:0; display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px 10px; font-size:13.5px}
.ecard dt{color:var(--muted)}
.ecard dd{margin:0; overflow-wrap:anywhere}
.plinks{display:flex; gap:6px; flex-wrap:wrap}
.plinks a{font-size:12.5px; font-weight:600; text-decoration:none; padding:3px 9px; border-radius:6px; background:var(--accent-soft); color:var(--accent)}
.contact{border-top:1px solid var(--line); padding-top:10px; font-size:13.5px}
.contact .missing{color:var(--tbc); font-weight:600}
.copy{font:inherit; font-size:12px; font-weight:600; border:1px solid var(--line); background:transparent; color:var(--accent); border-radius:6px; padding:2px 8px; margin-left:6px; cursor:pointer}
.matrix td.c{text-align:center; font-variant-numeric:tabular-nums; white-space:nowrap}
.matrix td.c.on{background:var(--accent-soft); color:var(--ink); font-weight:600}
.matrix th.c{text-align:center}
.matrix td:first-child{white-space:nowrap}
.note{font-size:13px; color:var(--muted); margin-top:10px; max-width:80ch}
footer{border-top:1px solid var(--line); margin-top:40px; padding-top:14px; font-size:12.5px; color:var(--muted); display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap}

@media (max-width:960px){
  .grid4{grid-template-columns:repeat(2, minmax(0,1fr))}
  .grid3,.ecards{grid-template-columns:repeat(2, minmax(0,1fr))}
  .hero,.two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
  .grid4,.grid3,.ecards,.checks{grid-template-columns:minmax(0,1fr)}
  .phead{flex-direction:column; align-items:flex-start; gap:8px}
  .phead .big{font-size:44px}
  .pager a{max-width:100%}
  .brand{width:100%}
}
@media (prefers-reduced-motion:reduce){ .pcard{transition:none} .pcard:hover{transform:none} }
/* barra LUISS: blu con filetto teal */
.bar{border-bottom:4px solid #0BB9B7}
.brand{display:inline-flex; align-items:center; gap:14px}
.brand .mk{font-family:var(--f-display); font-weight:800; font-size:22px; letter-spacing:0.02em; color:#FFFFFF}
.brand .bt{color:#FFFFFF; font-weight:700; display:flex; flex-direction:column; line-height:1.15; padding-left:14px; border-left:1px solid rgba(255,255,255,0.3)}
.brand .bt span{color:var(--navy-muted); font-weight:500; font-size:13px}
.bar .nav a[aria-current="page"]{color:#002A5C; background:#0BB9B7}
.box.inv h3{color:#0BB9B7}
@media (max-width:620px){ .brand .bt{display:none} }
/* credito NOREMA */
.credit{display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--muted)}
.credit>span{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase}
.credit .nm{display:inline-flex; color:var(--norema); line-height:0; padding:2px 0}
.credit .nm svg{height:28px; width:auto}
.credit .nm:hover{opacity:.8}
:root{--norema:#002A5C; --norema-accent:#0BB9B7}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--norema:#E7EAE9; --norema-accent:#0BB9B7} }
:root[data-theme="dark"]{--norema:#E7EAE9; --norema-accent:#0BB9B7}
footer{align-items:center}
footer>span{flex:1 1 0}
footer>span:last-child{text-align:right}
@media (max-width:620px){ footer{flex-direction:column; align-items:center; text-align:center} footer>span:last-child{text-align:center} }
</style>

<header class="bar">
  <div class="wrap">

    </nav>
  </div>
</header>

</head>

// Coach (Voce D): a carico di LUISS come Soggetto Cardine, ripartito pro quota sui progetti in base al budget
const COACH = {day:420, dpw:3, weeks:78};
const COACH_EUR = COACH.day * COACH.dpw * COACH.weeks;
const COACH_TOT = COACH_EUR * 1.2 / 1000;
const COACH_FREE = [];
const BASE = P.filter(p => !COACH_FREE.includes(p.n)).reduce((a, p) => a + p.budget, 0);
P.forEach(p => { const free = COACH_FREE.includes(p.n); const c = free ? 0 : COACH_TOT * p.budget / BASE; p.parts.push(['luiss', 'Coach dell’Insieme (Voce D, quota del progetto)', c]); p.budget = p.budget + c; });

// calcoli
P.forEach(p => {
  p.rows = p.parts.map(([id, role, sp]) => { const e = ENT[id]; const i = INT[e.type]; return {id, e, role, sp, i, c: Math.round(sp * i)}; });
  p.contrib = p.rows.reduce((a, r) => a + r.c, 0);
  p.pmi = p.rows.filter(r => r.e.kind === 'imp' && r.e.type !== 'Grande impresa').reduce((a, r) => a + r.sp, 0);
  p.gi = p.rows.filter(r => r.e.kind === 'imp' && r.e.type === 'Grande impresa').reduce((a, r) => a + r.sp, 0);
  p.tp = p.rows.filter(r => r.e.kind === 'cardine').reduce((a, r) => a + r.sp, 0);
  p.odr = p.rows.filter(r => r.e.kind === 'odr').reduce((a, r) => a + r.sp, 0);
  p.hasOdr = p.odr > 0;
});
const TOT = P.reduce((a, p) => ({sp: a.sp + p.budget, c: a.c + p.contrib, pmi: a.pmi + p.pmi, gi: a.gi + p.gi, tp: a.tp + p.tp, odr: a.odr + p.odr}), {sp:0, c:0, pmi:0, gi:0, tp:0, odr:0});

P.forEach(p => p.rows.forEach(r => { (byEnt[r.id] ||= {sp:0, c:0, ps:[]}); byEnt[r.id].sp += r.sp; byEnt[r.id].c += r.c; if (!byEnt[r.id].ps.includes(p.n)) byEnt[r.id].ps.push(p.n); }));

          <li>Contributo sotto 3 M€ per progetto</li>
          <li>Durata 18 mesi, SAL entro il 10° mese</li>
        </ul>
      </div>
      <div class="box">
        <h3 style="color:var(--warm)">Punti aperti</h3>
        <ol class="issues">
          <li>Obblighi di pubblicità del Soggetto Cardine (art. 4): verificare che LUISS li abbia completati, altrimenti i progetti non sono ammissibili</li>
          <li>Status di Organismo di Ricerca di LUISS e di Cyber 4.0 da confermare</li>
          <li>Gruppo Effort Cube (Dot Beyond, Argo Logica): se è grande impresa l’intensità scende al 40%. In ogni progetto le PMI indipendenti restano almeno al 30%</li>
          <li>Da individuare: Startup LUISS, PMI pilota della supply chain (indipendente dal gruppo), PMI cyber</li>
          <li>NOREMA è fuori dai progetti per il limite di 3 beneficiari oltre al Cardine: decidere se e dove inserirla</li>
          <li>Integrazioni in valutazione: formazione Agri con l’Istituto Agrario, progetto Biogis, SicuraNext sulla sicurezza</li>
          <li>Premio della fideiussione da aggiungere; Coach da dimensionare con LUISS. Domande dal 7 al 28 gennaio 2027</li>
        </ol>
      </div>
    </div>
  </section>`;
}

function viewProject(n){
  const p = P[n - 1];
  const prev = P[n - 2], next = P[n];
  const rows = p.rows.map(r => `
    <tr>
      <td class="ename"><a href="#anagrafica" data-ent="${r.id}">${esc(r.e.name)}</a><span class="etype">${esc(r.e.type)}${r.e.tbc ? ' · ruolo da confermare' : ''}</span></td>
      <td>${esc(r.role)}</td>
      <td class="r">${pctOf(r,p)}%</td>
      <td class="r">${fmt(r.sp)}</td>
      <td class="r">${Math.round(r.i*100)}%</td>
      <td class="r">${fmt(r.c)}</td>
    </tr>`).join('');
  const collab = p.hasOdr ? `Collaborazione effettiva garantita dall’Organismo di Ricerca (${pct(p.odr,p.budget)}% delle spese).` : `Collaborazione effettiva garantita da LUISS come Organismo di Ricerca (${pct(p.tp,p.budget)}% delle spese, Coach incluso).`;
  return `
  <a class="back" href="#insieme">← Torna all’Insieme</a>
  <div class="phead">
    <div class="big">P${p.n}</div>
    <div><h1>${esc(p.title)}</h1><p>${esc(p.sub)}</p></div>
  </div>

  <section>
    <div class="two">
      <div class="prose">
        <div class="sec-h"><h2>Il progetto</h2></div>
        ${p.desc.map(t => `<p>${esc(t)}</p>`).join('')}
        <div class="chips" style="margin-top:8px">${badges(p)}<span class="chip">Pilota: ${esc(p.pilot)}</span></div>
      </div>
      <div class="box amb">
        <h3 style="color:var(--accent)">Ambito</h3>
        <dl>
          <div><dt>STEP · ${esc(p.step[0])}</dt><dd>${esc(p.step[1])}</dd></div>
          <div><dt>RIS3 · ${esc(p.ris3[0])}</dt><dd>${esc(p.ris3[1])}</dd><div class="lvl">${esc(p.ris3[2])}</div></div>
        </dl>
      </div>
    </div>
  </section>

  <section>
    <div class="sec-h"><h2>Obiettivo realizzativo e risultati</h2></div>
    <div class="grid3">
      <div class="box"><h3 style="color:var(--accent)">Da TRL 4 a TRL 7</h3><p>${esc(p.trl)}</p></div>
      <div class="box"><h3 style="color:var(--accent)">Deliverable</h3><p>${esc(p.del)}</p></div>
      <div class="box"><h3 style="color:var(--accent)">Sfruttamento</h3><p>${esc(p.sfr)}</p></div>
    </div>
  </section>

  <section>
    <div class="sec-h"><h2>Partenariato e budget</h2><span class="chip teal">${new Set(p.rows.filter(r => r.e.kind !== 'cardine').map(r => r.id)).size} beneficiari + LUISS</span></div>
    <div class="tablebox">
      <table>
        <thead><tr><th>Soggetto</th><th>Ruolo</th><th class="r">Quota</th><th class="r">Spese k€</th><th class="r">Intensità</th><th class="r">Contributo k€</th></tr></thead>
        <tbody>${rows}
          <tr class="tot"><td>Totale</td><td></td><td class="r">100%</td><td class="r">${fmt(p.budget)}</td><td class="r">${pct(p.contrib,p.budget)}%</td><td class="r">${fmt(p.contrib)}</td></tr>
        </tbody>
      </table>
    </div>
    <p class="note">${collab} Tipologia B, durata 18 mesi. Spese comprensive del forfait del 20% e della quota del Coach. Intensità del 60% ipotizzata per tutte le PMI: per le medie imprese è il 50%, per le imprese di un gruppo di grandi dimensioni il 40%.</p>
  </section>

  <nav class="pager" aria-label="Altri progetti">
    ${prev ? `<a href="#p${prev.n}"><small>← P${prev.n}</small><b>${esc(prev.title)}</b></a>` : '<span></span>'}
    ${next ? `<a href="#p${next.n}" style="text-align:right"><small>P${next.n} →</small><b>${esc(next.title)}</b></a>` : `<a href="#anagrafica" style="text-align:right"><small>Poi →</small><b>Anagrafica</b></a>`}
  </nav>`;
}

let filt = 'tutti', q = '';
function entCard(id){
  const e = ENT[id], b = byEnt[id];
  const plinks = b ? b.ps.map(n => `<a href="#p${n}">P${n}</a>`).join('') : '<span class="chip tbc">Non assegnata</span>';
  const data = [];
  if (e.sede) data.push(['Sede', esc(e.sede)]);
  if (e.piva) data.push(['P.IVA', `<span class="num">${esc(e.piva)}</span>`]);
  if (e.web) data.push(['Sito', esc(e.web)]);
  if (b) data.push(['Spese', `<span class="num">${fmt(b.sp)} k€ · contributo ${fmt(b.c)} k€</span>`]);
  const cont = [];
  if (e.ref) cont.push(`<div>${esc(e.ref)}</div>`);
  if (e.email) cont.push(`<div><span class="num">${esc(e.email)}</span><button type="button" class="copy" data-copy="${esc(e.email)}">Copia</button></div>`);
  if (e.tel) cont.push(`<div class="num">${esc(e.tel)}</div>`);
  const typeChip = e.kind === 'odr' ? 'warm' : e.kind === 'ente' ? 'blue' : e.kind === 'cardine' ? 'dark' : 'teal';
  return `<article class="ecard" id="ent-${id}">
    <div class="row"><h3>${esc(e.name)}</h3><span class="chip ${typeChip}">${esc(e.type)}</span></div>
    <p class="prof">${esc(e.profile)}${e.tbc ? ' <span class="chip tbc">Profilo da confermare</span>' : ''}</p>
    ${e.kind !== 'ente' ? `<div class="plinks">${plinks}</div>` : ''}
    ${data.length ? `<dl>${data.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>` : ''}
    ${e.note ? `<p class="prof">${esc(e.note)}</p>` : ''}
    ${cont.length ? `<div class="contact">${cont.join('')}</div>` : ''}
  </article>`;
}
function entList(){
  const order = ['cardine','odr','imp','ente'];
  return Object.keys(ENT)
    .filter(id => filt === 'tutti' || (filt === 'imp' ? ENT[id].kind === 'imp' : filt === 'odr' ? ENT[id].kind === 'odr' : ['ente','cardine'].includes(ENT[id].kind)))
    .filter(id => !q || (ENT[id].name + ' ' + ENT[id].profile).toLowerCase().includes(q))
    .sort((a, b) => order.indexOf(ENT[a].kind) - order.indexOf(ENT[b].kind) || (byEnt[b]?.sp || 0) - (byEnt[a]?.sp || 0));
}
function viewAnagrafica(){
  const ids = Object.keys(ENT).filter(id => byEnt[id]).sort((a,b) => {const o=['cardine','odr','imp']; return o.indexOf(ENT[a].kind)-o.indexOf(ENT[b].kind) || byEnt[b].sp-byEnt[a].sp;});
  const mrows = ids.map(id => `<tr><td class="ename">${esc(ENT[id].name)}<span class="etype">${esc(ENT[id].type)}</span></td>${P.map(p => { const rs = p.rows.filter(x => x.id === id); const r = rs.length ? {sp: rs.reduce((a, x) => a + x.sp, 0)} : null; return r ? `<td class="c on">${fmt(r.sp)}</td>` : '<td class="c"></td>'; }).join('')}<td class="r">${fmt(byEnt[id].sp)}</td></tr>`).join('');
  return `
  <div class="eyebrow">Anagrafica</div>
  <h1 style="font-size:clamp(30px,4vw,44px); margin:6px 0 10px">Imprese, Organismi di Ricerca, stakeholder ed enti</h1>
  <p class="lead">${nImp} imprese, ${nOdr} Organismi di Ricerca, il Soggetto Cardine, gli stakeholder e gli enti dell’Avviso. I profili segnati in giallo sono ipotesi da far confermare a ciascun soggetto.</p>

  <section>
    <div class="tools">
      <div class="filter" role="group" aria-label="Filtra per tipo">
        <button type="button" data-f="tutti" aria-pressed="${filt==='tutti'}">Tutti</button>
        <button type="button" data-f="imp" aria-pressed="${filt==='imp'}">Imprese</button>
        <button type="button" data-f="odr" aria-pressed="${filt==='odr'}">Organismi di Ricerca</button>
        <button type="button" data-f="enti" aria-pressed="${filt==='enti'}">Cardine, stakeholder ed enti</button>
      </div>
      <div class="search"><label for="q">Cerca</label><input id="q" type="search" placeholder="Nome o competenza" value="${esc(q)}"></div>
    </div>
    <div class="ecards" id="ecards">${entList().map(entCard).join('')}</div>
  </section>

  <section>
    <div class="sec-h"><h2>Chi fa cosa: spese per progetto (k€)</h2></div>
    <div class="tablebox">
      <table class="matrix">
        <thead><tr><th>Soggetto</th>${P.map(p => `<th class="c"><a href="#p${p.n}">P${p.n}</a></th>`).join('')}<th class="r">Totale</th></tr></thead>
        <tbody>${mrows}<tr class="tot"><td>Totale</td>${P.map(p => `<td class="c">${fmt(p.budget)}</td>`).join('')}<td class="r">${fmt(TOT.sp)}</td></tr></tbody>
      </table>
    </div>
  </section>`;
}
